# Nginx reverse proxy for FA Management (cloud / Linux server)
#   Users -> https://app.company.com -> Nginx (SSL) -> Node.js app on 127.0.0.1:3100 -> PostgreSQL
# Copy to /etc/nginx/sites-available/fa-management.conf, link it into sites-enabled,
# set server_name and the certificate paths, then: sudo nginx -t && sudo systemctl reload nginx
# In the app's .env set: TRUST_PROXY=1, FORCE_HTTPS=true, CLIENT_URL=https://app.company.com

server {
    listen 80;
    server_name app.company.com;
    return 301 https://$host$request_uri;            # http -> https
}

server {
    listen 443 ssl http2;
    server_name app.company.com;

    ssl_certificate     /etc/ssl/certs/app.company.com.crt;      # or Let's Encrypt: /etc/letsencrypt/live/app.company.com/fullchain.pem
    ssl_certificate_key /etc/ssl/private/app.company.com.key;    #                   /etc/letsencrypt/live/app.company.com/privkey.pem
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 20m;                        # Excel uploads (the app allows 10 MB)
    proxy_read_timeout 600s;                         # long exports / Year-End Archive
    proxy_send_timeout 600s;

    gzip on;
    gzip_types text/css application/javascript application/json;

    location / {
        proxy_pass http://127.0.0.1:3100;            # the app serves the screens and /api on one port
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
